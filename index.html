<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Restaurant ERP Pro v3.0 | Complete Management</title>
    <style>
        :root {
            --primary: #ff6b35; --primary-dark: #e55a2b; --secondary: #2ec4b6; --accent: #ffbf46;
            --danger: #e71d36; --success: #06d6a0; --warning: #ffd166; --info: #118ab2;
            --bg: #f8fafc; --card-bg: #ffffff; --sidebar-bg: #0f172a;
            --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.12); --shadow-xl: 0 20px 50px rgba(0,0,0,0.15);
            --radius-sm: 8px; --radius: 12px; --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --text-light: #94a3b8;
            --border: #334155; --shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
        ::-webkit-scrollbar{width:5px;height:5px}
        ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

        .header{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:1000;box-shadow:0 4px 30px rgba(0,0,0,.3)}
        .header h1{font-size:1.3rem;font-weight:700}
        .header-badges{display:flex;gap:8px;flex-wrap:wrap}
        .badge{padding:6px 14px;border-radius:20px;font-size:.75rem;font-weight:600;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;gap:5px;cursor:pointer}
        .badge.red{background:#e71d36;animation:pulse 2s infinite}
        .badge.orange{background:#f59e0b;color:#000}
        .badge.green{background:#06d6a0;color:#000}
        @keyframes pulse{50%{opacity:.6}}

        .global-search{position:relative}
        .global-search input{padding:10px 16px;border-radius:24px;border:none;width:300px;font-size:.85rem;background:rgba(255,255,255,.15);color:#fff}
        .global-search input::placeholder{color:rgba(255,255,255,.6)}
        .global-search input:focus{outline:none;background:rgba(255,255,255,.25)}
        .search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-xl);max-height:300px;overflow-y:auto;display:none;z-index:999;margin-top:4px}
        .search-dropdown.show{display:block}
        .search-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:var(--transition)}
        .search-item:hover{background:#fff3e0}

        .layout{display:flex;min-height:calc(100vh - 60px)}
        .sidebar{width:220px;background:var(--sidebar-bg);color:#fff;padding:16px 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;flex-shrink:0}
        .sidebar-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;transition:var(--transition);font-size:.9rem;border-left:3px solid transparent;color:#a0aec0}
        .sidebar-item:hover{background:rgba(255,255,255,.08);color:#fff}
        .sidebar-item.active{background:rgba(255,107,53,.2);border-left-color:var(--primary);color:#fff;font-weight:600}

        .main-content{flex:1;padding:20px;overflow-y:auto}
        .tab-panel{display:none;animation:fadeIn .3s ease}
        .tab-panel.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        .card{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--border)}
        .card-header{font-size:1.1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--primary);padding-bottom:10px;border-bottom:2px solid #fff3e0}
        .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
        .stat-card{background:var(--card-bg);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--primary);cursor:pointer;transition:var(--transition)}
        .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
        .stat-card.danger{border-left-color:var(--danger)}.stat-card.success{border-left-color:var(--success)}.stat-card.warning{border-left-color:var(--warning)}
        .stat-value{font-size:1.8rem;font-weight:700}
        .stat-label{font-size:.75rem;color:var(--text-light);text-transform:uppercase;font-weight:600;letter-spacing:.5px}

        .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
        .kpi-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;cursor:pointer;transition:var(--transition);border-left:5px solid var(--kpi-color,var(--primary));position:relative;overflow:hidden}
        .kpi-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;background:var(--kpi-color,var(--primary));opacity:.1;border-radius:50%}
        .kpi-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-xl)}
        .kpi-icon{font-size:2.5rem;position:relative;z-index:1}
        .kpi-data{position:relative;z-index:1}
        .kpi-value{font-size:1.8rem;font-weight:800;line-height:1.2}
        .kpi-label{font-size:.75rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
        .kpi-change{font-size:.7rem;font-weight:600;margin-top:2px}
        .kpi-change.positive{color:var(--success)}.kpi-change.negative{color:var(--danger)}
        .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;margin-bottom:20px}
        .chart-card{min-height:300px}.chart-card canvas{max-height:220px}
        .bottom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px}

        .table-container{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card-bg)}
        table{width:100%;border-collapse:collapse;font-size:.85rem}
        thead{background:#fef9f5}
        th{padding:12px 14px;text-align:left;font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--primary-dark);border-bottom:2px solid #ffe0cc;white-space:nowrap}
        td{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
        tbody tr{transition:var(--transition)}tbody tr:hover{background:#fff8f0}

        .btn{padding:8px 18px;border:none;border-radius:20px;cursor:pointer;font-weight:600;font-size:.8rem;transition:var(--transition);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
        .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
        .btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#000}.btn-danger{background:var(--danger);color:#fff}.btn-warning{background:var(--warning);color:#000}.btn-info{background:var(--info);color:#fff}
        .btn-sm{padding:5px 12px;font-size:.7rem}.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary);color:#fff}

        .form-group{margin-bottom:10px}.form-group label{display:block;font-weight:600;font-size:.8rem;margin-bottom:4px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem;background:var(--card-bg);transition:var(--transition);font-family:inherit}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
        .form-row{display:flex;gap:10px;flex-wrap:wrap}.form-row .form-group{flex:1;min-width:150px}
        .filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fffdf7;border-radius:var(--radius);margin-bottom:12px;align-items:center;border:1px solid var(--border)}
        .chip{padding:6px 14px;border-radius:20px;border:2px solid var(--border);cursor:pointer;font-weight:600;font-size:.8rem;transition:var(--transition);background:var(--card-bg)}
        .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.chip:hover{border-color:var(--primary)}

        .toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 18px;border-radius:var(--radius);color:#fff;font-weight:600;animation:slideIn .3s ease;box-shadow:var(--shadow-lg);cursor:pointer;max-width:350px;display:flex;align-items:center;gap:8px}
        .toast.success{background:#06d6a0;color:#000}.toast.error{background:#e71d36}.toast.warning{background:#ffd166;color:#000}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:9998;display:none;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
        .modal-overlay.show{display:flex}
        .modal{background:var(--card-bg);border-radius:var(--radius-lg);padding:24px;width:95%;max-width:650px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:modalPop .3s ease}
        @keyframes modalPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#eee;cursor:pointer;font-size:1.1rem;transition:var(--transition)}
        .modal-close:hover{background:var(--danger);color:#fff;transform:rotate(90deg)}

                @media(max-width:768px){.sidebar{width:60px}.sidebar-item span{display:none}.header h1{font-size:1rem}.charts-grid{grid-template-columns:1fr}.bottom-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.global-search input{width:150px}}

        /* ============ PRINT STYLES ============ */
        @media print {
            body { background: white !important; }
            .header, .sidebar, .tab-nav, .toast-container, .modal-overlay, 
            .btn:not(.print-btn), .filter-bar, .global-search, .header-badges,
            .card-header button, .kpi-change, .no-print { display: none !important; }
            
            .layout { display: block !important; }
            .main-content { padding: 0 !important; margin: 0 !important; }
            .tab-panel { display: block !important; }
            .card { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; page-break-inside: avoid; }
            .card-header { border-bottom: 2px solid #000 !important; color: #000 !important; }
            table { font-size: 11px !important; }
            th { background: #eee !important; color: #000 !important; border-bottom: 2px solid #000 !important; }
            td { border-bottom: 1px solid #ccc !important; }
            .stat-card, .kpi-card { border: 1px solid #ddd !important; box-shadow: none !important; }
            
            @page { margin: 10mm; size: A4; }
        }

        /* Print Preview Modal */
        .print-preview-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 10000; display: flex;
            justify-content: center; align-items: center;
        }
        .print-preview-content {
            background: white; width: 90%; max-width: 800px; max-height: 90vh;
            overflow-y: auto; border-radius: 8px; padding: 20px;
        }
        .print-preview-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #eee;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <header class="header">
        <div style="display:flex;align-items:center;gap:16px;flex:1">
            <h1>🍽️ Restaurant ERP Pro v3.0</h1>
            <div class="global-search">
                <input type="text" id="globalSearch" placeholder="🔍 Search orders, items, staff..." oninput="globalSearchHandler(this.value)">
                <div id="searchResults" class="search-dropdown"></div>
            </div>
        </div>
        <div class="header-badges">
            <span class="badge red">⚠ Low: <strong id="lowStockCount">0</strong></span>
            <span class="badge orange">💰 Unpaid: <strong id="unpaidCount">0</strong></span>
            <span class="badge green">📊 <strong id="todaySalesAmount">Rs.0</strong></span>
            <span class="badge" onclick="toggleTheme()">🌓</span>
            <span style="font-size:.75rem" id="currentDateTime"></span>
        </div>
    </header>

    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-item active" data-tab="dashboard"><span>📊</span><span>Dashboard</span></div>
            <div class="sidebar-item" data-tab="pos"><span>🛒</span><span>POS Order</span></div>
            <div class="sidebar-item" data-tab="kitchen"><span>🔥</span><span>Kitchen</span></div>
            <div class="sidebar-item" data-tab="bom"><span>📋</span><span>Recipes</span></div>
            <div class="sidebar-item" data-tab="inventory"><span>📦</span><span>Inventory</span></div>
            <div class="sidebar-item" data-tab="purchases"><span>🛍</span><span>Purchases</span></div>
            <div class="sidebar-item" data-tab="billing"><span>💳</span><span>Billing</span></div>
            <div class="sidebar-item" data-tab="expenses"><span>🧾</span><span>Expenses</span></div>
            <div class="sidebar-item" data-tab="staff"><span>👥</span><span>Staff</span></div>
            <div class="sidebar-item" data-tab="reports"><span>📊</span><span>Reports</span></div>
            <div class="sidebar-item" data-tab="forecast"><span>🔮</span><span>Forecast</span></div>
            <div class="sidebar-item" data-tab="settings"><span>⚙️</span><span>Settings</span></div>
            <div class="sidebar-item" data-tab="audit"><span>📝</span><span>Audit Log</span></div>
        </nav>

        <main class="main-content" id="mainContent">
            <div class="tab-panel active" id="tab-dashboard"></div>
            <div class="tab-panel" id="tab-pos"></div>
            <div class="tab-panel" id="tab-kitchen"></div>
            <div class="tab-panel" id="tab-bom"></div>
            <div class="tab-panel" id="tab-inventory"></div>
            <div class="tab-panel" id="tab-purchases"></div>
            <div class="tab-panel" id="tab-billing"></div>
            <div class="tab-panel" id="tab-expenses"></div>
            <div class="tab-panel" id="tab-staff"></div>
            <div class="tab-panel" id="tab-reports"></div>
            <div class="tab-panel" id="tab-forecast"></div>
            <div class="tab-panel" id="tab-settings"></div>
            <div class="tab-panel" id="tab-audit"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

    <script>
    // ==================== DATABASE ====================
    const DB={save(k,v){localStorage.setItem('erpv3_'+k,JSON.stringify(v))},load(k){const d=localStorage.getItem('erpv3_'+k);return d?JSON.parse(d):null},get(k,def){return this.load(k)||def}};

    // ==================== DATA ====================
    let rawMaterials=DB.get('rm',[
        {id:1,name:'Chicken',unit:'kg',stock:15,min:5,cost:780,lastPurchase:'2026-06-28',category:'Meat'},
        {id:2,name:'Cooking Oil',unit:'liter',stock:8,min:3,cost:420,lastPurchase:'2026-07-01',category:'Grocery'},
        {id:3,name:'Tomatoes',unit:'kg',stock:10,min:2,cost:110,lastPurchase:'2026-07-02',category:'Vegetables'},
        {id:4,name:'Onions',unit:'kg',stock:18,min:5,cost:75,lastPurchase:'2026-07-01',category:'Vegetables'},
        {id:5,name:'Flour',unit:'kg',stock:25,min:10,cost:85,lastPurchase:'2026-06-30',category:'Grocery'},
        {id:6,name:'Spices Mix',unit:'kg',stock:4,min:1,cost:580,lastPurchase:'2026-06-29',category:'Spices'},
        {id:7,name:'Basmati Rice',unit:'kg',stock:20,min:5,cost:210,lastPurchase:'2026-07-02',category:'Grocery'},
        {id:8,name:'Yogurt',unit:'kg',stock:6,min:2,cost:150,lastPurchase:'2026-07-03',category:'Dairy'},
        {id:9,name:'Garlic Ginger',unit:'kg',stock:3,min:.5,cost:280,lastPurchase:'2026-06-28',category:'Spices'},
        {id:10,name:'Green Chilies',unit:'kg',stock:2,min:.5,cost:140,lastPurchase:'2026-07-02',category:'Vegetables'},
        {id:11,name:'Mutton',unit:'kg',stock:8,min:3,cost:1350,lastPurchase:'2026-07-01',category:'Meat'},
        {id:12,name:'Butter',unit:'kg',stock:4,min:1,cost:680,lastPurchase:'2026-07-03',category:'Dairy'},
        {id:13,name:'Burger Buns',unit:'pcs',stock:50,min:20,cost:25,lastPurchase:'2026-07-03',category:'Bakery'},
        {id:14,name:'Cheese Slices',unit:'pcs',stock:40,min:15,cost:45,lastPurchase:'2026-07-02',category:'Dairy'},
        {id:15,name:'Potatoes',unit:'kg',stock:30,min:10,cost:60,lastPurchase:'2026-07-01',category:'Vegetables'},
        {id:16,name:'Chicken Patty',unit:'pcs',stock:35,min:15,cost:95,lastPurchase:'2026-07-03',category:'Frozen'},
        {id:17,name:'Soft Drinks',unit:'bottles',stock:60,min:20,cost:55,lastPurchase:'2026-07-02',category:'Beverages'}
    ]);

    let menuItems=DB.get('mi',[
        {id:101,name:'Chicken Biryani',cat:'Rice',price:380},{id:102,name:'Mutton Biryani',cat:'Rice',price:480},
        {id:103,name:'Veg Biryani',cat:'Rice',price:280},{id:104,name:'Plain Rice',cat:'Rice',price:160},
        {id:201,name:'Zinger Burger',cat:'Burgers',price:420},{id:202,name:'Cheese Burger',cat:'Burgers',price:350},
        {id:203,name:'Chicken Burger',cat:'Burgers',price:300},{id:301,name:'French Fries',cat:'Fries',price:180},
        {id:302,name:'Masala Fries',cat:'Fries',price:220},{id:303,name:'Cheese Fries',cat:'Fries',price:280},
        {id:401,name:'Chicken Karahi',cat:'Main Course',price:1250},{id:402,name:'Butter Chicken',cat:'Main Course',price:980},
        {id:501,name:'Naan',cat:'Bread',price:55},{id:502,name:'Roti',cat:'Bread',price:30},
        {id:601,name:'Cold Drink',cat:'Beverages',price:80},{id:602,name:'Lassi',cat:'Beverages',price:120},
        {id:701,name:'Gulab Jamun',cat:'Desserts',price:150},{id:801,name:'Chicken Tikka',cat:'Starters',price:540},
        {id:802,name:'Seekh Kebab',cat:'Starters',price:460}
    ]);

    let bomData=DB.get('bom',{
        101:[{m:1,q:0.22},{m:7,q:0.15},{m:2,q:0.04},{m:8,q:0.06},{m:6,q:0.02}],
        102:[{m:11,q:0.2},{m:7,q:0.15},{m:2,q:0.05},{m:6,q:0.025}],
        201:[{m:13,q:1},{m:16,q:1},{m:14,q:1},{m:15,q:0.15},{m:2,q:0.03}],
        301:[{m:15,q:0.2},{m:2,q:0.05}],
        401:[{m:1,q:0.25},{m:2,q:0.06},{m:3,q:0.1},{m:4,q:0.05},{m:6,q:0.025},{m:9,q:0.015}],
        501:[{m:5,q:0.15},{m:12,q:0.01}],
        801:[{m:1,q:0.22},{m:8,q:0.08},{m:6,q:0.02}]
    });

    let staff=DB.get('st',[
        {id:1,name:'Ahmed Khan',role:'Admin',salary:60000,att:[],sales:0,orders:0},
        {id:2,name:'Sara Ali',role:'Manager',salary:45000,att:[],sales:0,orders:0},
        {id:3,name:'Bilal',role:'Waiter',salary:25000,att:[],sales:0,orders:0},
        {id:4,name:'Usman',role:'Chef',salary:40000,att:[],dishes:0},
        {id:5,name:'Hassan',role:'Waiter',salary:25000,att:[],sales:0,orders:0}
    ]);

    let orders=DB.get('ord',[]);
    let movements=DB.get('mov',[]);
    let purchases=DB.get('pur',[]);
    let expenses=DB.get('exp',[]);
    let auditLog=DB.get('audit',[]);
    let settings=DB.get('set',{restaurantName:'My Restaurant',taxPercent:5,serviceCharge:10,currency:'Rs.',kitchenRefresh:8,lowStockAlert:true});
    let curOrder={table:1,waiter:3,type:'Dine-in',items:[],total:0,discount:0,discountType:'%',tax:0,serviceCharge:0,notes:'',customerName:'',customerPhone:''};
    let nextId=DB.get('nid',1001);
    let holdOrders=DB.get('hold',[]);

    // ==================== HELPERS ====================
    const fmt=n=>settings.currency+' '+Number(n).toLocaleString('en-PK',{maxFraction:0});
    const today=()=>new Date().toISOString().split('T')[0];
    const month=()=>new Date().toISOString().substring(0,7);
    const getMat=id=>rawMaterials.find(m=>m.id===id);
    const getMenu=id=>menuItems.find(m=>m.id===id);
    const getStaff=id=>staff.find(s=>s.id===id);
    const bomCost=mid=>{const b=bomData[mid];return b?b.reduce((t,i)=>t+(getMat(i.m)?.cost||0)*i.q,0):0};
    const addAudit=(action,module,detail)=>{auditLog.unshift({time:new Date().toISOString(),action,module,detail,user:'Admin'});if(auditLog.length>500)auditLog.length=500};

    function save(){DB.save('rm',rawMaterials);DB.save('mi',menuItems);DB.save('bom',bomData);DB.save('st',staff);DB.save('ord',orders);DB.save('mov',movements);DB.save('pur',purchases);DB.save('exp',expenses);DB.save('audit',auditLog);DB.save('set',settings);DB.save('nid',nextId);DB.save('hold',holdOrders);updateBadges()}

    function addMovement(mid,type,qty,ref='',note=''){const mat=getMat(mid);if(!mat)return;movements.push({id:Date.now(),mid,mname:mat.name,type,qty,unit:mat.unit,date:today(),ref,note,cost:mat.cost,val:qty*mat.cost});if(type==='purchase')mat.stock+=qty;else mat.stock=Math.max(0,mat.stock-qty);if(type==='purchase')mat.lastPurchase=today()}

    function getItemStation(mid){const item=getMenu(mid);if(!item)return'main';const cat=item.cat?.toLowerCase()||'';if(cat.includes('bbq')||cat.includes('tikka')||cat.includes('kebab'))return'bbq';if(cat.includes('drink')||cat.includes('beverage')||cat.includes('lassi'))return'drinks';if(cat.includes('burger')||cat.includes('fries')||cat.includes('fast'))return'fastfood';if(cat.includes('bread')||cat.includes('naan')||cat.includes('roti'))return'tandoor';return'main'}

    function createOrder(table,wid,items,type='Dine-in',notes='',custName='',custPhone=''){
        const subtotal=items.reduce((s,i)=>s+(i.price||0)*(i.qty||0),0);
        const disc=curOrder.discountType==='%'?subtotal*curOrder.discount/100:curOrder.discount;
        const tax=(subtotal-disc)*settings.taxPercent/100;
        const sc=(subtotal-disc)*settings.serviceCharge/100;
        const total=Math.max(0,subtotal-disc+tax+sc);
        const itemsWithStatus=items.map(i=>({mid:i.mid||i.menuItemId,name:i.name,price:i.price||0,qty:i.qty||1,complimentary:i.complimentary||false,itemStatus:'pending',itemStatusTime:new Date().toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'}),station:getItemStation(i.mid||i.menuItemId)}));
        const o={id:nextId++,table,wid,wname:getStaff(wid)?.name||'?',type,items:itemsWithStatus,subtotal,discount:disc,discountType:curOrder.discountType,tax,serviceCharge:sc,total,status:'pending',paid:false,method:null,date:today(),time:new Date().toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'}),month:month(),notes,custName,custPhone};
        itemsWithStatus.forEach(i=>{if(i.complimentary)return;const b=bomData[i.mid];if(b)b.forEach(x=>addMovement(x.m,'consumption',x.q*i.qty,`Order #${o.id}`,`${i.name} x${i.qty}`))});
        orders.unshift(o);const w=getStaff(wid);if(w){w.sales=(w.sales||0)+o.total;w.orders=(w.orders||0)+1}
        addAudit('Order Created','POS',`Order #${o.id} - ${fmt(o.total)}`);save();return o
    }

                    <h3>🖨️ Print Preview - ${title}</h3>

                    ${content}

            </div>`;
        document.body.appendChild(preview);
        preview.addEventListener('click', function(e) {

    function renderHourlyChart(data){const ctx=document.getElementById('hourlyChart');if(!ctx)return;if(ctx._chart)ctx._chart.destroy();const labels=['12-2','2-4','4-6','6-8','8-10','10-12','12-2','2-4','4-6','6-8','8-10','10-12'];ctx._chart=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Sales (Rs.)',data,backgroundColor:'rgba(255,107,53,0.7)',borderColor:'#ff6b35',borderWidth:1,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}}}})}
    function renderCategoryChart(data){const ctx=document.getElementById('categoryChart');if(!ctx)return;if(ctx._chart)ctx._chart.destroy();const labels=Object.keys(data);const values=Object.values(data);const colors=['#ff6b35','#2ec4b6','#ffbf46','#118ab2','#7c3aed','#e71d36','#06d6a0','#f59e0b'];ctx._chart=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors.slice(0,labels.length),borderWidth:2,borderColor:'white'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:10}}}}})}

                        bomDropdown.classList.remove('show');

        function saveMovementUI(type){
        const mid=parseInt(document.getElementById('amMat').value), qty=parseFloat(document.getElementById('amQty').value), note=document.getElementById('amNote')?.value||'';
        if(!qty||qty<=0) return toast('Enter quantity!','error');

            const cost=parseFloat(document.getElementById('amCost')?.value)||getMat(mid).cost;
            const supp=document.getElementById('amSupp')?.value||'';
            const poId = 'PO-'+Date.now();
            const mat = getMat(mid);
            // RECORD RATE HISTORY if cost changed
            if(mat && cost !== mat.cost){
                rateHistory.push({
                    id: 'RH-'+Date.now(),
                    date: today(),
                    materialId: mid,
                    materialName: mat.name,
                    oldCost: mat.cost,
                    newCost: cost,
                    supplier: supp,
                    poRef: poId
                });
                DB.save('rateHistory', rateHistory);
                if(cost > mat.cost){
                    toast(`⚠ ${mat.name} price increased from ${fmt(mat.cost)} to ${fmt(cost)}! Check menu pricing.`,'warning');
                }
            }
            purchases.push({id:poId,date:today(),mid,mname:mat?.name||'',qty,unit:mat?.unit||'',cost,total:qty*cost,supp,note});
            if(mat && cost!==mat.cost) mat.cost = cost;
        }
        addMovement(mid,type,qty,type==='purchase'?'PO-'+Date.now():'W-'+Date.now(),note);
        save();closeModal();renderInventory();toast('Recorded!');
    }

    function renderRateHistory(){
        const container = document.getElementById('purContent');
        const searchMat = document.getElementById('rateSearch')?.value || '';
        const dateFrom = document.getElementById('rateDateFrom')?.value || '';
        const dateTo = document.getElementById('rateDateTo')?.value || '';
        
        // Record rate changes whenever purchase is made
        // (We'll auto-record in saveMovementUI)
        
        let history = [...rateHistory];
        if(searchMat) history = history.filter(h => h.materialName.toLowerCase().includes(searchMat.toLowerCase()));
        if(dateFrom) history = history.filter(h => h.date >= dateFrom);
        if(dateTo) history = history.filter(h => h.date <= dateTo);
        history.sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
        
        // Group by material for summary
        const matSummary = {};
        history.forEach(h => {
            if(!matSummary[h.materialId]) matSummary[h.materialId] = {name:h.materialName, firstCost:h.oldCost, latestCost:h.newCost, changes:0, history:[]};
            matSummary[h.materialId].latestCost = h.newCost;
            matSummary[h.materialId].changes++;
            matSummary[h.materialId].history.push(h);
        });
        
        container.innerHTML = `
        <div class="card-header">📈 Material Purchase Rate History</div>
        
        <!-- Price Change Summary Cards -->
        <div class="card-grid" style="margin-bottom:16px;">
            ${Object.values(matSummary).map(m => {
                const change = m.latestCost - m.firstCost;
                const changePercent = m.firstCost > 0 ? ((change/m.firstCost)*100).toFixed(1) : 0;
                const trend = change > 0 ? '📈 UP' : change < 0 ? '📉 DOWN' : '➡ SAME';
                const trendColor = change > 0 ? 'var(--danger)' : change < 0 ? 'var(--success)' : 'var(--text-light)';

                    <div style="color:${trendColor};font-weight:700;">${trend} ${changePercent}%</div>
                    <div style="margin-top:4px;font-size:0.65rem;color:var(--text-light);">${change>0?'⚠ Price increased! Check menu pricing.':change<0?'✅ Price decreased! Better margin.':'Price stable.'}</div>
                </div>`;
            }).join('')}
            ${Object.keys(matSummary).length===0?'<div class="stat-card"><div class="stat-label">No rate history yet</div><small>Purchase items to see rate changes</small></div>':''}

        <!-- Rate History Table -->

                return `<tr>
                    <td>${h.date}</td>
                    <td><strong>${h.materialName}</strong></td>
                    <td>${fmt(h.oldCost)}</td>
                    <td>${fmt(h.newCost)}</td>
                    <td style="color:${diff>0?'var(--danger)':diff<0?'var(--success)':'var(--text-light)'};font-weight:700;">

        <!-- Menu Price Suggestions -->

            <div class="table-container"><table>
                <thead><tr><th>Dish</th><th>Current Price</th><th>Current Cost</th><th>Current Margin</th><th>Suggested Price</th><th>Action</th></tr></thead>

                    const suggestedPrice = Math.ceil(currentCost * 2.5 / 10) * 10; // 60% margin rounded
                    const needsUpdate = currentMargin < 50;
                    return `<tr style="${needsUpdate?'background:#fff3e0;':''}">
                        <td><strong>${m.name}</strong></td>
                        <td>${fmt(m.price)}</td>
                        <td>${fmt(currentCost)}</td>
                        <td style="color:${currentMargin<40?'var(--danger)':currentMargin<60?'var(--warning)':'var(--success)'};font-weight:700;">${currentMargin}%</td>
                        <td><strong>${fmt(suggestedPrice)}</strong></td>
                        <td>${needsUpdate?`<button class="btn btn-sm btn-warning" onclick="updateMenuPrice(${m.id},${suggestedPrice})">📝 Update</button>`:'✅ OK'}</td>
                    </tr>`;

        </div>`;

    function payBillFull(oid){
        const method = prompt('Payment method (cash/card/online):','cash');
        if(method){const o=orders.find(o=>o.id===oid);if(o){o.paid=true;o.status='paid';o.method=method;save();addAudit('Payment','Billing',`#${oid} - ${fmt(o.total)} via ${method}`);renderBilling();renderKitchen();toast(`Paid ${fmt(o.total)}!`);}}
    }

    function payBillPartialUI(oid, total){
        const o = orders.find(o=>o.id===oid);
        const alreadyPaid = customerLedger.filter(l=>l.ref===`ORDER-${oid}`&&l.type==='payment').reduce((s,l)=>s+l.amount,0);
        const balance = total - alreadyPaid;
        openModal(`<h3>📝 Partial Payment - Order #${oid}</h3>
        <p>Total: <strong>${fmt(total)}</strong></p>
        <p>Already Paid: <strong style="color:var(--success);">${fmt(alreadyPaid)}</strong></p>
        <p>Balance: <strong style="color:var(--danger);">${fmt(balance)}</strong></p>
        <div class="form-group"><label>Amount to Pay</label><input type="number" id="partAmt" value="${balance}" step="0.01" max="${balance}"></div>
        <div class="form-group"><label>Method</label><select id="partMethod"><option>Cash</option><option>Card</option><option>Online</option></select></div>
        <button class="btn btn-success btn-lg" onclick="savePartialPayment(${oid},${total})">💾 Save Payment</button>`);
    }

    function savePartialPayment(oid, total){
        const amt = parseFloat(document.getElementById('partAmt').value);
        const method = document.getElementById('partMethod').value;
        if(!amt||amt<=0) return toast('Enter amount!','error');
        const alreadyPaid = customerLedger.filter(l=>l.ref===`ORDER-${oid}`&&l.type==='payment').reduce((s,l)=>s+l.amount,0);
        const newTotal = alreadyPaid + amt;
        customerLedger.push({id:'PAY-'+Date.now(),date:today(),customerName:'Walk-in',type:'payment',amount:amt,ref:`ORDER-${oid}`,method});
        if(newTotal >= total){
            const o = orders.find(o=>o.id===oid);
            if(o){o.paid=true;o.status='paid';o.method=method;}
            toast('Full payment completed! ✅');
        } else {
            toast(`Partial payment: ${fmt(amt)}. Remaining: ${fmt(total-newTotal)}`,'warning');
        }
        DB.save('custLedger',customerLedger);
        save();closeModal();renderBilling();renderKitchen();
    }

    function creditSaleUI(oid, total){
        const o = orders.find(o=>o.id===oid);
        const custName = prompt('Customer name for credit:', o?.custName || 'Credit Customer');
        if(!custName) return;
        customerLedger.push({id:'SALE-'+Date.now(),date:today(),customerName:custName,type:'sale',amount:total,ref:`ORDER-${oid}`});
        if(o){o.paid=true;o.status='paid';o.method='Credit';o.custName=custName;}
        DB.save('custLedger',customerLedger);
        save();closeModal();renderBilling();renderKitchen();
        toast(`Credit sale to ${custName}: ${fmt(total)}`);
    }

            customers[name].transactions.push(l);

        container.innerHTML = `

    function renderReports(){const panel=document.getElementById('tab-reports');const dayOrd=orders.filter(o=>o.date===today());const paidToday=dayOrd.filter(o=>o.paid);const daySales=paidToday.reduce((s,o)=>s+o.total,0);const dayCost=paidToday.reduce((s,o)=>s+o.items.reduce((si,i)=>si+bomCost(i.mid)*i.qty,0),0);const dayExp=expenses.filter(e=>e.date===today()).reduce((s,e)=>s+e.amount,0);const allItems=paidToday.flatMap(o=>o.items);const totalItems=allItems.length;const avgCompletion=totalItems>0?allItems.filter(i=>(i.itemStatus||'served')==='served').length/totalItems*100:0;const catStats={};paidToday.forEach(o=>o.items.forEach(i=>{const item=getMenu(i.mid);const cat=item?.cat||'Other';if(!catStats[cat])catStats[cat]={total:0,served:0};catStats[cat].total++;if((i.itemStatus||'served')==='served')catStats[cat].served++}));panel.innerHTML=`<div class="kpi-grid"><div class="kpi-card" style="--kpi-color:var(--success)"><div class="kpi-icon">💰</div><div class="kpi-data"><div class="kpi-value">${fmt(daySales)}</div><div class="kpi-label">Today Sales</div><div class="kpi-change positive">${paidToday.length} paid orders</div></div></div><div class="kpi-card" style="--kpi-color:var(--warning)"><div class="kpi-icon">📊</div><div class="kpi-data"><div class="kpi-value">${fmt(dayCost)}</div><div class="kpi-label">Raw Material Cost</div></div></div><div class="kpi-card" style="--kpi-color:var(--info)"><div class="kpi-icon">📋</div><div class="kpi-data"><div class="kpi-value">${totalItems}</div><div class="kpi-label">Total Items Prepared</div><div class="kpi-change">${avgCompletion.toFixed(0)}% served</div></div></div><div class="kpi-card" style="--kpi-color:${daySales-dayCost-dayExp>=0?'var(--success)':'var(--danger)'}"><div class="kpi-icon">📈</div><div class="kpi-data"><div class="kpi-value">${fmt(daySales-dayCost-dayExp)}</div><div class="kpi-label">Today Net Profit</div></div></div></div><div class="charts-grid"><div class="card chart-card"><div class="card-header">📊 Category-wise Completion</div><div class="table-container"><table><thead><tr><th>Category</th><th>Total Items</th><th>Served</th><th>Completion</th></tr></thead><tbody>${Object.entries(catStats).map(([cat,stats])=>`<tr><td><strong>${cat}</strong></td><td>${stats.total}</td><td>${stats.served}</td><td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${(stats.served/stats.total*100)}%;background:var(--success);border-radius:4px"></div></div><span style="font-size:.75rem;font-weight:600">${(stats.served/stats.total*100).toFixed(0)}%</span></div></td></tr>`).join('')}</tbody></table></div></div><div class="card chart-card"><div class="card-header">🕐 Recent Orders Detail</div><div style="max-height:250px;overflow-y:auto">${orders.slice(0,10).map(o=>`<div style="padding:8px;border-bottom:1px solid var(--border);font-size:.8rem"><strong>#${o.id}</strong> Table ${o.table} | ${fmt(o.total)} | <span style="color:${o.paid?'var(--success)':'var(--warning)'}">${o.paid?'PAID':'UNPAID'}</span><div style="font-size:.7rem;color:var(--text-light)">${o.items.map(i=>`${i.name}: ${i.itemStatus||'pending'}`).join(' | ')}</div></div>`).join('')}</div>

    function renderSettings(){const panel=document.getElementById('tab-settings');panel.innerHTML=`<div class="card"><div class="card-header">⚙️ Settings</div><div class="form-row"><div class="form-group"><label>Restaurant Name</label><input type="text" id="setName" value="${settings.restaurantName}"></div><div class="form-group"><label>Tax %</label><input type="number" id="setTax" value="${settings.taxPercent}" step="0.1"></div></div><div class="form-row"><div class="form-group"><label>Service Charge %</label><input type="number" id="setSC" value="${settings.serviceCharge}" step="0.1"></div><div class="form-group"><label>Currency</label><input type="text" id="setCur" value="${settings.currency}"></div></div><button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button><button class="btn btn-warning" onclick="exportData()">📥 Export Backup</button><button class="btn btn-danger" onclick="importData()">📤 Import Backup</button></div>`}
    function saveSettings(){settings.restaurantName=document.getElementById('setName').value;settings.taxPercent=parseFloat(document.getElementById('setTax').value)||0;settings.serviceCharge=parseFloat(document.getElementById('setSC').value)||0;settings.currency=document.getElementById('setCur').value;save();toast('Settings saved!')}
    function exportData(){const data={rawMaterials,menuItems,bomData,staff,orders,movements,purchases,expenses,auditLog,settings,nextId,holdOrders};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-${today()}.json`;a.click();toast('Backup exported!')}
    function importData(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=(e)=>{const file=e.target.files[0];const reader=new FileReader();reader.onload=(ev)=>{try{const data=JSON.parse(ev.target.result);rawMaterials=data.rawMaterials||rawMaterials;menuItems=data.menuItems||menuItems;bomData=data.bomData||bomData;staff=data.staff||staff;orders=data.orders||[];movements=data.movements||[];purchases=data.purchases||[];expenses=data.expenses||[];auditLog=data.auditLog||[];settings=data.settings||settings;nextId=data.nextId||1001;holdOrders=data.holdOrders||[];save();toast('Backup imported! Reloading...');setTimeout(()=>location.reload(),1500)}catch(err){toast('Invalid file!','error')}};reader.readAsText(file)};input.click()}

    // ==================== AUDIT ====================
    function renderAudit(){const panel=document.getElementById('tab-audit');panel.innerHTML=`<div class="card"><div class="card-header">📝 Audit Log</div><div class="table-container"><table><thead><tr><th>Time</th><th>User</th><th>Module</th><th>Action</th><th>Detail</th></tr></thead><tbody>${auditLog.slice(0,100).map(a=>`<tr><td>${new Date(a.time).toLocaleString()}</td><td>${a.user}</td><td>${a.module}</td><td>${a.action}</td><td>${a.detail}</td></tr>`).join('')}</tbody></table></div></div>`}

    // ==================== TAB SWITCHING ====================
    function switchTab(tab){document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));const btn=document.querySelector(`[data-tab="${tab}"]`);if(btn)btn.classList.add('active');const panel=document.getElementById(`tab-${tab}`);if(panel)panel.classList.add('active');const renders={dashboard:renderDashboard,pos:renderPOS,kitchen:renderKitchen,bom:renderBOM,inventory:renderInventory,purchases:renderPurchases,billing:renderBilling,expenses:renderExpenses,staff:renderStaff,reports:renderReports,forecast:renderForecast,settings:renderSettings,audit:renderAudit};if(renders[tab])renders[tab]()}

    document.getElementById('sidebar').addEventListener('click',e=>{const item=e.target.closest('.sidebar-item');if(item)switchTab(item.dataset.tab)});
    document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.ctrlKey&&e.key==='n'){e.preventDefault();switchTab('pos')}});

    function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';localStorage.setItem('erpv3_theme',h.dataset.theme)}
    function updateClock(){document.getElementById('currentDateTime').textContent=new Date().toLocaleString('en-PK',{dateStyle:'medium',timeStyle:'short'})}
    setInterval(updateClock,30000);updateClock();

    // Init
    document.documentElement.dataset.theme=localStorage.getItem('erpv3_theme')||'light';
    renderDashboard();updateBadges();
    document.addEventListener('click',e=>{if(!e.target.closest('.global-search'))document.getElementById('searchResults')?.classList.remove('show')});
    </script>
</body>
</html>
